<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>  html, body { margin: 0; background: #1B2430; }
  .tile {
    width: 440px; height: 280px; box-sizing: border-box; padding: 36px 36px 32px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #1B2430; color: #FAF7F0; font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { display: block; }
  .words { display: flex; flex-direction: column; gap: 6px; }
  .wordmark {
    font-family: 'Big Shoulders Display', sans-serif; font-size: 58px; font-weight: 900;
    letter-spacing: 0.02em; line-height: 0.9; text-transform: uppercase;
  }
  .tagline { font-size: 15px; font-weight: 500; letter-spacing: 0.01em; color: #F2A516; }
  .trip { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #26313F; border-radius: 14px; }
  .trip-info { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; }
  .trip-route { font-size: 14px; font-weight: 500; }
  .trip-meta { font-size: 12px; color: #B8C0CB; }
  .trip-cost { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: #F2A516; }
</style>
</head>
<body>
<div class="tile">
  <div class="brand">
    <svg width="84" height="84" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#26313F"/><path d="M31.1 91 A38 38 0 1 1 96.9 91" fill="none" stroke="#F2A516" stroke-width="13" stroke-linecap="round"/><line x1="64" y1="74" x2="87" y2="51" stroke="#FAF7F0" stroke-width="9" stroke-linecap="round"/><circle cx="64" cy="74" r="10" fill="#FAF7F0"/></svg>
    <div class="words">
      <div class="wordmark">Tankful</div>
      <div class="tagline">Fuel cost for every route</div>
    </div>
  </div>
  <div class="trip">
    <div class="trip-info">
      <span class="trip-route">Gdańsk → Berlin · 513 km</span>
      <span class="trip-meta">5 hr 3 min · Petrol 95</span>
    </div>
    <span class="trip-cost">≈ PLN 347</span>
  </div>
</div>
</body>
</html>
