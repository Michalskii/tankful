<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="welcome_page_title">Tankful</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main>
    <header class="brand">
      <svg width="64" height="64" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="28" fill="#26313F"/><path d="M31.1 91 A38 38 0 1 1 96.9 91" fill="none" stroke="#F2A516" stroke-width="13" stroke-linecap="round"/><line x1="64" y1="74" x2="87" y2="51" stroke="#FAF7F0" stroke-width="9" stroke-linecap="round"/><circle cx="64" cy="74" r="10" fill="#FAF7F0"/></svg>
      <div>
        <h1>Tankful</h1>
        <p class="tagline" data-i18n="welcome_tagline"></p>
      </div>
    </header>
    <p class="lead" data-i18n="welcome_lead"></p>

    <form id="form">
      <fieldset>
        <legend data-i18n="label_fuel"></legend>
        <div id="fuels" class="fuels"></div>
      </fieldset>

      <label class="field"><span data-i18n="label_units"></span>
        <select id="units">
          <option value="metric" data-i18n="units_metric"></option>
          <option value="us" data-i18n="units_us"></option>
        </select>
      </label>

      <label class="field"><span data-i18n="welcome_consumption"></span>
        <span class="with-unit">
          <input id="consumption" type="number" step="0.1" min="0.1" required>
          <span id="unit">l / 100 km</span>
        </span>
      </label>

      <p id="price" class="price"></p>

      <button type="submit" data-i18n="welcome_submit"></button>
      <p class="hint" data-i18n="welcome_hint"></p>
    </form>
  </main>
  <script src="settings.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
