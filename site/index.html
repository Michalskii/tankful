<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip fuel cost calculator – Tankful</title>
    <meta name="description" content="Work out the fuel cost of a trip with current average prices in Poland and the EU – across borders, for electric cars and per person." />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <script>
      let theme = null
      try { theme = localStorage.getItem("tankful-theme") } catch {}
      const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
      document.documentElement.classList.toggle("dark", dark)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="messages.js"></script>
    <script src="boot.js"></script>
    <script src="settings.js"></script>
    <script src="borders.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
