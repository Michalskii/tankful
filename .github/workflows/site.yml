name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: node tests/test.js
      - run: node tools/fetch-prices.js _prices.json https://koszt-paliwa.pl/prices.json
      - run: node tools/fetch-history.js _history.json https://koszt-paliwa.pl/history.json
      - run: node tools/build-site.js _prices.json --history=_history.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: IndexNow
        continue-on-error: true
        run: |
          curl -fsS "https://koszt-paliwa.pl/indexnow.json?t=$(date +%s)" -o indexnow.json
          if grep -q '"urlList":\[\]' indexnow.json; then echo "IndexNow: nothing changed"; exit 0; fi
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json)
          echo "IndexNow: HTTP $code"
          if [ "$code" != 200 ] && [ "$code" != 202 ]; then echo "::warning title=IndexNow::HTTP $code $(cat response.txt)"; fi
